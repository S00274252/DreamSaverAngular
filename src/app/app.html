<mat-toolbar class="app-toolbar">
  <a class="brand" routerLink="/dashboard">DreamSaver</a>

  <nav aria-label="Main navigation" class="app-nav">
    @if (auth.isLoggedIn()) {
      <a matButton routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">Dashboard</a>
      <a matButton routerLink="/deposits" routerLinkActive="active" ariaCurrentWhenActive="page">Deposits</a>
      <a matButton routerLink="/funds" routerLinkActive="active" ariaCurrentWhenActive="page">Funds</a>
      <a matButton routerLink="/dreams" routerLinkActive="active" ariaCurrentWhenActive="page">Dreams</a>
      <a matButton [routerLink]="['/users', currentUser.userId(), 'edit']" routerLinkActive="active" ariaCurrentWhenActive="page">
        {{ currentUser.user()?.name }}
      </a>
      <button matButton type="button" (click)="auth.logout()">Log out</button>
    } @else {
      <a matButton routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Log in</a>
      <a matButton routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page">Register</a>
    }
  </nav>
</mat-toolbar>

<main>
  <router-outlet />
</main>
