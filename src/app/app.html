<mat-toolbar class="app-toolbar">
  <a class="brand" routerLink="/dashboard">DreamSaver</a>

  <nav aria-label="Main navigation" class="app-nav">
    <a matButton routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">Dashboard</a>
    <a matButton routerLink="/deposits" routerLinkActive="active" ariaCurrentWhenActive="page">Deposits</a>
    <a matButton routerLink="/funds" routerLinkActive="active" ariaCurrentWhenActive="page">Funds</a>

</mat-toolbar>

<main>
  <router-outlet />
